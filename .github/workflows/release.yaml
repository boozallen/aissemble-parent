# This workflow kicks off the releases a new version of aissemble-parent and deploys artifacts to Maven Central.

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Release aiSSEMBLE Parent

on:
    workflow_dispatch:
        inputs:
            releaseVersion:
                description: "Release version"
                required: true
            developmentVersion:
                description: "Next development version"
                required: true

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Import GPG key
              uses: crazy-max/ghaction-import-gpg@v6
              with:
                  gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
                  passphrase: ${{ secrets.GPG_PRIVATE_KEY_PASSPHRASE }}

            - name: Check out code
              uses: actions/checkout@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: '17'
                  distribution: 'temurin'
                  cache: maven

            - name: Create settings.xml
              id: create-settings-xml
              run: |
                  cat > $HOME/.m2/settings.xml << EOF
                  <settings>
                    <servers>
                      <server>
                        <id>central</id>
                        <username>${{ secrets.SONATYPE_CENTRAL_REPO_TOKEN_USER }}</username>
                        <password>${{ secrets.SONATYPE_CENTRAL_REPO_TOKEN_KEY }}</password>
                      </server>
                    </servers>
                  </settings>
                  EOF
                  echo "HOME_DIR=$HOME" >> "$GITHUB_OUTPUT"
                  
            - name: Release aiSSEMBLE Parent
              run: |
                  git config --local user.email "aissemble-noreply@bah.com"
                  git config --local user.name "Github Actions"
                  git checkout -b ${{ inputs.releaseVersion }}-release
                  mvn -B release:prepare release:perform -Pcentral-release -DreleaseVersion=${{ inputs.releaseVersion }} -DdevelopmentVersion=${{ inputs.developmentVersion }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
